<body>
  <div class="veil"><main>
    <p class="eyebrow">לרבקה שלי, באהבה</p>
    <h1>עוד רגע,<br>לתמיד.</h1>
    <p class="intro">שבוע של הפתעות קטנות,<br>בדרך לרגע הכי גדול שלנו.</p>
    <div class="date-pill">יום שני · 19 באוקטובר 2026</div>
    <div class="countdown" aria-label="הזמן עד בוקר החתונה"><div class="time-unit"><b id="timerMinutes">00</b><span>דקות</span></div><span class="time-dot">:</span><div class="time-unit"><b id="timerHours">00</b><span>שעות</span></div><span class="time-dot">:</span><div class="time-unit"><b id="timerDays">00</b><span>ימים</span></div></div>
    <div class="board-heading"><h2>כל יום, קצת יותר קרובים</h2><span>12–19 באוקטובר</span></div>
    <section class="days" id="days" aria-label="ימי הספירה לאחור"></section>
    <p class="open-note" id="status" aria-live="polite"></p>
    <div class="footer-heart" aria-hidden="true">♡</div><div class="footer-copy">שמונה בקרים. אהבה אחת.</div>
    <button class="preview" id="previewButton" type="button" hidden>תצוגה מקדימה</button>
  </main></div>
  <dialog id="letterDialog"><article class="letter"><button class="close" id="closeDialog" aria-label="סגירה">×</button><div class="letter-date" id="letterDate"></div><h2 id="letterTitle"></h2><div class="memory" id="memory"></div><p id="letterText"></p><div class="mission" id="mission"></div><div class="signature">שלך, תמיד ♥</div></article></dialog>
  <script>
    // החליפו כאן בקלות את הטקסט והמשימה של כל יום. אפשר להוסיף גם תמונות בעתיד.
    const DAYS = [
      ['יום שני',12,'פתיחה ראשונה','','', {type:'photo',src:'day-01-letter.jpg',alt:'המכתב שלי לרבקה ליום הראשון'}],
      ['יום שלישי',13,'הסיפור שלנו','','', {type:'photo',src:'day-02-letter.jpg',alt:'המכתב שלי לרבקה ליום השני'}],
      ['יום רביעי',14,'מחכה לחיים איתך','רבקה שלי,\n\nעוד חמישה ימים נהיה מתחת לחופה, ואני מוצא את עצמי חושב דווקא על מה שיבוא אחריה. על ערב רגיל בבית, על שיחה בסוף יום, ועל זה שלא נצטרך לסיים כל מפגש בפרידה.\n\nאני מתגעגע אלייך השבוע. גם כשאנחנו לא מדברים, את איתי במחשבות — בכל פעם שאני נזכר שעוד מעט כל הדברים הפשוטים האלה יהיו שלנו.\n\nמחכה כבר להגיד לך לילה טוב, ולהישאר.', 'רגע בשבילך: תחשבי על דבר קטן שהיית רוצה שיהיה חלק מהשגרה שלנו — ארוחת בוקר ביחד, הליכה בערב, או משהו אחר שהוא לגמרי את. תשמרי אותו לספר לי אחרי החתונה.', {type:'song',url:'https://www.youtube.com/watch?v=e8LX8SxYWdI',title:'פשוטים',artist:'עקיבא',note:'בשביל כל הרגעים הקטנים בבית שעוד מחכים לנו.'}],
      ['יום חמישי',15,'מותר גם לחייך','אהובה שלי,\n\nעוד ארבעה ימים, ואני עדיין מנסה להתרגל לזה שבקרוב אוכל להגיד ״אשתי״ ולהתכוון אלייך. כנראה שבהתחלה אגיד את זה גם כשאין שום סיבה. סליחה מראש.\n\nאם היום עמוס בסידורים, קחי רגע לזכור שהדבר שהכי משמח אותי כבר סגור: זו את. לא צריך לסמן עליו וי, ולא צריך להתקשר לאף אחד כדי לאשר.\n\nאני מקווה שיש לך היום גם רגע לצחוק, לנשום ולאכול משהו טעים. אוהב אותך, ומתקרב אלייך בעוד יום.', 'רגע בשבילך: תבחרי משהו קטן שמשמח אותך ותני לו מקום היום — כוס שתייה אהובה, משהו מתוק או כמה דקות עם מישהי שעושה לך טוב. בלי קשר לרשימת הסידורים.', {type:'song',url:'https://www.youtube.com/watch?v=T5Wf3gmF6Do',title:'סיבת הסיבות',artist:'ישי ריבו',note:'קצת שמחה בתוך כל ההתרגשות של השבוע הזה.'}],
      ['יום שישי',16,'השבת שלפני','רבקה שלי,\n\nזו השבת האחרונה לפני שנהיה בעל ואישה. יש משהו במשפט הזה שגורם לי לעצור. כל ההמתנה שלנו מתקרבת לסוף, וממש מעבר לה מחכה התחלה חדשה.\n\nאני חושב על השבתות שעוד נעשה יחד, על הבית שנבנה, ועל השקט של להיות במקום שלנו. אני רוצה שיהיה לך בו נעים להיות את — עם כל מה שאת מביאה איתך, ועם מקום גם לחלומות שעוד לא סיפרנו.\n\nשתהיה לך שבת טובה ורגועה, אהובה. אני מחכה לשבת הראשונה שלנו יחד.', 'רגע בשבילך: לפני שבת, קחי דקה לבקשה קטנה על הבית שלנו — משהו שהיית רוצה שנשמור בו תמיד. לא צריך לכתוב או לשלוח, רק לתת לזה מקום בלב.', {type:'song',url:'https://www.youtube.com/watch?v=RpiwlGky60w',title:'שבת גן עדן',artist:'יעקב שוואקי ואליעד',note:'לכבוד השבת שלפני, ולכבוד השבתות שעוד יהיו שלנו.',timing:'להאזנה לפני כניסת שבת, או במוצאי שבת.'}],
      ['שבת',17,'תודה עלייך','אהובה שלי,\n\nעוד יומיים לחתונה. היום רציתי פשוט להגיד תודה. עלייך, על זה שאנחנו בדרך הזאת יחד, ועל האמון שאנחנו נותנים אחד בשנייה.\n\nיש דברים שאי אפשר להסביר עד הסוף במכתב. אני רק יודע שכאשר אני חושב על העתיד, אני רוצה אותך שם. גם בימים היפים והחגיגיים, וגם בימים הרגילים שבהם הכי צריך מישהו שמקשיב.\n\nמקווה שיש לך היום קצת מנוחה. אני שולח לך מכאן הרבה אהבה, ושומר את החיבוק לעוד ממש מעט.', 'רגע בשבילך: תיזכרי ברגע אחד שלנו שהיית רוצה לשמור איתך מתחת לחופה. לא צריך לעשות איתו שום דבר — רק לחייך אליו לרגע.', {type:'song',url:'https://www.youtube.com/watch?v=HZYivKwVmJc',title:'קטנתי',artist:'יונתן רזאל',note:'שיר של תודה על הטוב שכבר יש בחיים שלנו.',timing:'שמרתי לך שיר למוצאי שבת; הוא יחכה כאן גם אז.'}],
      ['יום ראשון',18,'מחר אראה אותך','רבקה שלי,\n\nמחר. אחרי כל הפעמים שספרנו כמה עוד נשאר, פתאום אפשר להגיד רק מילה אחת.\n\nאני מתרגש לראות אותך. מדמיין את הרגע הזה, ומבין שכנראה כל מה שתכננתי להגיד יברח לי. אז שיהיה כתוב כאן מראש: אני אוהב אותך, ואני שמח שזו את.\n\nאם הלב שלך היום מלא בהמון דברים בבת אחת, זה בסדר. את לא צריכה להספיק עוד משהו בשבילי. תני למי שסביבך לעזור לך, תאכלי, תשתי ותנוחי כשאפשר.\n\nלילה טוב, הכלה שלי. מחר כבר נהיה באותו צד של ההמתנה.', 'רגע בשבילך: לפני השינה, תני לעצמך חמש דקות בלי סידורים ובלי רשימות. נשימה אחת עמוקה, כוס מים, והמחשבה הזאת: מחר אנחנו נפגשים.', {type:'song',url:'https://www.youtube.com/watch?v=6EcDNWjQxMk',title:'אקדם את פנייך',artist:'ישי ריבו',note:'בשביל הרגע שאני כבר כל כך מחכה לו — לראות אותך מגיעה.'}],
      ['יום שני',19,'בוקר טוב, הכלה שלי','רבקה שלי,\n\nהיום אנחנו מתחתנים. כתבתי את זה, קראתי שוב, ועדיין קשה לי להאמין שזה כבר כאן.\n\nבתוך כל האנשים, התמונות וההתרגשות, אני רוצה שתדעי שאני מחכה לפגוש אותך. אני מקווה שתצליחי ליהנות גם מהרגעים הקטנים של היום הזה, ולא רק לחכות לרגע הגדול.\n\nמתחת לחופה אבחר בך להיות אשתי. ואחריה אני רוצה להמשיך לבחור בנו — להקשיב, לשמח אותך, ללמוד אותך, ולבנות איתך בית שיהיה שלנו.\n\nתודה שאת הולכת איתי בדרך הזאת. אני אוהב אותך. נתראה בחופה.', 'רגע בשבילך: קחי רגע אחד הבוקר שהוא רק שלך. הסתכלי במראה, נשמי, וחייכי לעצמך. לא בשביל מצלמה — בשביל לזכור איך הרגיש הבוקר שבו התחתנו.', {type:'song',url:'https://www.youtube.com/watch?v=u2FzBma7eIA',title:'עוד ישמע — גרסת החופה',artist:'ישי ריבו',note:'לבוקר שלנו. שיהיו בבית שנבנה הרבה שמחה, אהבה וקולות של חיים.'}]
    ];
    const daysEl=document.getElementById('days'),statusEl=document.getElementById('status'),dialog=document.getElementById('letterDialog');
    let preview=false;
    const previewEnabled=new URLSearchParams(location.search).get('preview')==='1';
    document.getElementById('previewButton').hidden=!previewEnabled;
    const israelTime=()=>new Date();
    function unlockTime(day){ return new Date(`2026-10-${day}T10:00:00+03:00`); }
    function available(day){ return preview || israelTime() >= unlockTime(day); }
    function showLetter(i){
      const d=DAYS[i],media=d[5],memory=document.getElementById('memory');
      document.getElementById('letterDate').textContent=`${d[0]} · ${d[1]} באוקטובר`;
      document.getElementById('letterTitle').textContent=d[2];
      document.getElementById('letterText').textContent=d[3];
      document.getElementById('letterText').hidden=!d[3];
      const mission=document.getElementById('mission');mission.hidden=!d[4];mission.replaceChildren();
      if(d[4]){const label=document.createElement('strong');label.textContent='✦ '+d[4].split(':')[0]+':';mission.append(label,document.createTextNode(d[4].split(':').slice(1).join(':')))}
      memory.replaceChildren();memory.hidden=false;
      if(media.type==='photo'&&media.src)memory.innerHTML=`<a class="image-link" href="${media.src}" target="_blank" rel="noopener"><img src="${media.src}" alt="${media.alt||'זיכרון שלכם'}"><span class="image-hint">לחצי לקריאה בגודל מלא ↗</span></a>`;
      else if(media.type==='video'&&media.src)memory.innerHTML=`<video controls playsinline src="${media.src}"></video>`;
      else if(media.type==='song'&&media.url){
        const card=document.createElement('div');card.className='song-card';
        [['song-eyebrow','שיר בשבילך ♫'],['song-title',media.title],['song-artist',media.artist],['song-note',media.note]].forEach(([cls,text])=>{const element=document.createElement('div');element.className=cls;element.textContent=text;card.append(element)});
        const link=document.createElement('a');link.className='song-link';link.href=media.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='להאזנה ב־YouTube ↗';card.append(link);
        if(media.timing){const timing=document.createElement('div');timing.className='song-timing';timing.textContent=media.timing;card.append(timing)}memory.append(card);
      }else memory.hidden=true;
      dialog.showModal();dialog.scrollTop=0;
    }
    function render(){ const now=israelTime();daysEl.innerHTML=''; let next=null; DAYS.forEach((d,i)=>{const open=available(d[1]); if(!open&&!next)next=unlockTime(d[1]);const card=document.createElement('button');card.className='day'+(open?' available':'')+(d[1]===19?' wedding':'');card.disabled=!open;card.setAttribute('aria-label',open?`פתיחת ${d[0]}, ${d[1]} באוקטובר`:`נעול עד ${d[1]} באוקטובר ב-10:00`);card.innerHTML=`<span class="card-date"><span class="weekday">${d[0]}</span><span class="day-number">${d[1]}</span></span><span class="lock-wrap"><img class="lock-art" src="ornate-lock.png" alt="" loading="lazy"></span><span class="day-caption">${d[1]===19?'היום שלנו':`עוד ${19-d[1]} ${19-d[1]===1?'יום':'ימים'}`}</span><span class="occasion">${open?'ההפתעה שלך מחכה ♡':d[1]===19?'✦ בוקר החתונה · 10:00':'נפתח ב־10:00'}</span>`;if(open)card.addEventListener('click',()=>{card.classList.add('opening');setTimeout(()=>{showLetter(i);card.classList.remove('opening')},matchMedia('(prefers-reduced-motion: reduce)').matches?0:650)});daysEl.appendChild(card); });
      if(preview)statusEl.textContent='תצוגה מקדימה — כל ההפתעות פתוחות לבדיקה.';else if(next){const diff=next-now;const days=Math.floor(diff/864e5),hours=Math.floor(diff%864e5/36e5),mins=Math.floor(diff%36e5/6e4);statusEl.textContent=`ההפתעה הבאה בעוד ${days?days+' ימים, ':''}${hours} שעות ו־${mins} דקות. בכל בוקר ב־10:00, לפי שעון ישראל.`}else statusEl.textContent='כל ההפתעות פתוחות. מכאן — לתמיד ♡'; }
    function updateTimer(){const left=Math.max(0,unlockTime(19)-new Date());document.getElementById('timerDays').textContent=String(Math.floor(left/864e5)).padStart(2,'0');document.getElementById('timerHours').textContent=String(Math.floor(left%864e5/36e5)).padStart(2,'0');document.getElementById('timerMinutes').textContent=String(Math.floor(left%36e5/6e4)).padStart(2,'0')}
    dialog.addEventListener('close',()=>{dialog.querySelectorAll('video').forEach(video=>video.pause())});updateTimer();setInterval(updateTimer,1000);
    document.getElementById('previewButton').addEventListener('click',()=>{preview=!preview;document.getElementById('previewButton').textContent=preview?'חזרה למצב האמיתי':'תצוגה מקדימה לבעל האתר';render()});document.getElementById('closeDialog').addEventListener('click',()=>dialog.close()); dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render();setInterval(render,60000);
  </script>
</body></html>
