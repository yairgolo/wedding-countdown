<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff7f1" />
  <title>רבקה, עוד רגע אנחנו מתחתנים</title>
  <meta name="description" content="שמונה בקרים קטנים בדרך ליום הגדול שלנו" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23d88b9b' d='M32 54S6 38 6 19C6 7 21 5 32 18 43 5 58 7 58 19c0 19-26 35-26 35Z'/%3E%3Cpath fill='%23fff7f1' d='M20 20h24v26H20z' rx='4'/%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    :root { --wine:#754052; --rose:#df97a9; --blush:#fff1f2; --gold:#bc9149; --ink:#392832; --paper:rgba(255,253,251,.83); }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); font-family:Heebo,Arial,sans-serif; background:#fff9f3 url('floral-background.png') center/cover fixed; }
    button { font:inherit } .veil { min-height:100vh; padding:42px 18px 52px; background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.74),rgba(255,249,245,.22) 55%,rgba(255,242,240,.48)); }
    main { max-width:1050px; margin:auto; text-align:center; } .eyebrow { color:#a87c35; font-size:.76rem; font-weight:800; letter-spacing:.18em; margin:0 0 12px; }
    h1 { font-family:'Playfair Display',Heebo,serif; font-size:clamp(2.25rem,7vw,4.7rem); margin:0; color:var(--wine); line-height:1.04; text-shadow:0 2px 12px rgba(255,255,255,.9); } h1 .heart { color:var(--rose); font-family:Arial; font-size:.62em; }
    .intro { font-size:1.08rem; margin:16px auto 21px; max-width:520px; line-height:1.7; } .date-pill { display:inline-flex; gap:8px; align-items:center; padding:9px 17px; background:rgba(255,255,255,.68); border:1px solid rgba(191,149,78,.36); color:#795c29; border-radius:999px; box-shadow:0 7px 22px rgba(118,72,55,.08); backdrop-filter:blur(8px); }
    .days { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:36px; } .day { position:relative; min-height:232px; border:1px solid rgba(255,255,255,.9); border-radius:25px; padding:18px 12px; cursor:pointer; color:var(--ink); background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,246,246,.73)); box-shadow:0 16px 35px rgba(104,61,69,.1), inset 0 1px 0 white; overflow:hidden; transition:transform .32s ease, box-shadow .32s ease, background .32s; }
    .day::after{content:'';position:absolute;inset:7px;border:1px solid rgba(190,145,73,.16);border-radius:19px;pointer-events:none}.day:not(:disabled):hover { transform:translateY(-7px); background:#fff; box-shadow:0 22px 40px rgba(104,61,69,.18); }.day:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.day:disabled{cursor:not-allowed}
    .day.wedding { background:linear-gradient(145deg,#fffaf0,#fff0f3); border-color:rgba(191,149,78,.46); } .day.wedding .day-number { color:var(--gold); }
    .card-date{position:relative;z-index:2;display:block}.weekday { color:#9b6a79; font-weight:800; font-size:.86rem; }.day-number{display:block;font-family:'Playfair Display',serif;font-size:3rem;line-height:.95;color:var(--wine);margin:7px 0 2px}.month{font-size:.78rem;color:#876d74}.occasion{position:absolute;z-index:2;bottom:15px;left:12px;right:12px;min-height:20px;font-size:.75rem;color:#9e7839;font-weight:800}
    .lock-wrap { position:absolute; inset:49px 0 25px; display:grid; place-items:center; transition:opacity .5s,transform .5s; z-index:1; }.lock-wrap.open { opacity:0; transform:scale(1.18); pointer-events:none; }.lock-art{width:106px;filter:drop-shadow(0 9px 8px rgba(92,58,22,.23));transform:rotate(-3deg);transition:transform .3s}.day:not(:disabled):hover .lock-art{transform:rotate(4deg) scale(1.03)}
    .open-note { margin:29px auto 0; min-height:26px; font-size:.96rem; color:#745762; }.preview { margin-top:14px; min-height:38px; background:none; border:0; text-decoration:underline; color:#9b7381; cursor:pointer; font-size:.82rem; }
    dialog { width:min(680px,calc(100% - 20px)); max-height:90vh; border:0; border-radius:28px; padding:0; color:var(--ink); background:#fffdf9; box-shadow:0 25px 80px rgba(68,35,46,.35); } dialog::backdrop { background:rgba(68,35,46,.36); backdrop-filter:blur(4px) } .letter { padding:clamp(25px,6vw,55px); text-align:right; background:linear-gradient(135deg,rgba(255,241,242,.7),transparent 60%); }.close { float:left; border:0; border-radius:50%; width:42px;height:42px;background:#f7e3e7;color:var(--wine);font-size:1.6rem;cursor:pointer }.letter .letter-date { color:var(--gold);font-weight:800 }.letter h2 { font-family:'Playfair Display',Heebo,serif;color:var(--wine);font-size:clamp(2rem,5vw,3rem);margin:16px 0 11px }.letter p { white-space:pre-line;font-size:1.12rem;line-height:1.9;margin:0 }.mission { margin-top:24px;padding:15px 18px;border-radius:15px;background:#fff4e7;border-right:4px solid var(--gold);line-height:1.7 }.mission strong{color:#9a6c27}.signature{margin-top:25px;color:var(--wine);font-family:'Playfair Display',Heebo,serif;font-style:italic;font-size:1.25rem}.memory{margin:22px 0 24px;border-radius:19px;overflow:hidden;background:#fff3ef;border:1px solid rgba(217,142,161,.24)}.memory img,.memory video{display:block;width:100%;max-height:330px;object-fit:cover}.media-placeholder{min-height:170px;display:grid;place-items:center;text-align:center;padding:20px;color:#8d6370;background:linear-gradient(135deg,#fff1f2,#fff8ed);font-size:1rem;line-height:1.6}.song-link{display:flex;align-items:center;justify-content:center;gap:10px;min-height:82px;padding:16px;color:var(--wine);font-weight:800;text-decoration:none;background:linear-gradient(135deg,#fff3f4,#fff9ec)}.song-link span{font-size:1.5rem}
    @media(max-width:680px){body{background-attachment:scroll}.veil{padding:29px 12px calc(35px + env(safe-area-inset-bottom))}.eyebrow{font-size:.68rem;margin-bottom:10px}h1{font-size:2.45rem}.days{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}.day{min-height:201px;border-radius:21px;padding:15px 8px}.day::after{inset:6px;border-radius:16px}.lock-wrap{inset:48px 0 22px}.lock-art{width:90px}.intro{font-size:.98rem;margin:13px auto 17px}.day-number{font-size:2.4rem}.weekday{font-size:.78rem}.occasion{bottom:12px;font-size:.67rem;white-space:nowrap}.letter{padding:25px 20px 30px}.letter p{font-size:1.05rem;line-height:1.82}.mission{font-size:.98rem}.memory img,.memory video{max-height:250px}.preview{min-height:44px;padding:8px 12px}}
  </style>
</head>
<body>
  <div class="veil"><main>
    <p class="eyebrow">FOR REBECCA · WITH ALL MY HEART</p>
    <h1>רבקה, עוד רגע <span class="heart">♥</span><br>אנחנו מתחתנים</h1>
    <p class="intro">שמונה בקרים קטנים. שמונה הפתעות. ורגע אחד גדול שמתחיל בדיוק עכשיו.</p>
    <div class="date-pill">✦ 12–19 באוקטובר 2026 ✦</div>
    <section class="days" id="days" aria-label="ימי הספירה לאחור"></section>
    <p class="open-note" id="status" aria-live="polite"></p>
    <button class="preview" id="previewButton" type="button">תצוגה מקדימה לבעל האתר</button>
  </main></div>
  <dialog id="letterDialog"><article class="letter"><button class="close" id="closeDialog" aria-label="סגירה">×</button><div class="letter-date" id="letterDate"></div><h2 id="letterTitle"></h2><div class="memory" id="memory"></div><p id="letterText"></p><div class="mission" id="mission"></div><div class="signature">שלך, תמיד ♥</div></article></dialog>
  <script>
    // החליפו כאן בקלות את הטקסט והמשימה של כל יום. אפשר להוסיף גם תמונות בעתיד.
    const DAYS = [
      ['יום שני',12,'פתיחה ראשונה','אהובה שלי, מתחילים את השבוע שלנו. היום אני רוצה שתזכרי כמה הדרך אלייך הייתה הדבר הכי יפה שקרה לי.\n\nקחי נשימה עמוקה — אנחנו ממש כאן.', 'משימה קטנה: כתבי לי הודעה עם שלושה דברים שאת הכי מתרגשת מהם השבוע.', {type:'photo',src:'',hint:'כאן תכניס תמונה מרגע שמזכיר לך את תחילת הסיפור שלכם'}],
      ['יום שלישי',13,'הסיפור שלנו','רבקה, יש לנו כבר כל כך הרבה רגעים קטנים שהם רק שלנו. היום תני לעצמך לחייך אל אחד מהם — ואני מבטיח לשמור על כל השאר.','משימה קטנה: בחרי תמונה אחת שלנו שאת אוהבת במיוחד ושלחי לי אותה.', {type:'song',url:'',hint:'כאן אפשר לשים קישור לשיר שהוא רק שלכם'}],
      ['יום רביעי',14,'באמצע הדרך','הימים רצים, אבל אני רוצה שנזכור גם לעצור. אני לא מתרגש רק מהחתונה — אני מתרגש מהחיים שמחכים לנו אחריה.','משימה קטנה: פנקי את עצמך היום במשהו קטן ומתוק. זה צו.', {type:'video',src:'',hint:'כאן תוכל להוסיף סרטון קצר, ברכה מצולמת או רגע מצחיק'}],
      ['יום חמישי',15,'חיוך אחד גדול','אם היום לחוץ או עמוס, תזכרי שיש בצד השני של כל הסידורים מישהו שמחכה להיות בעלך. כן, אני עדיין מתרגש מלכתוב את זה.','משימה קטנה: מצאי חמש דקות לשיר בקול שיר שעושה לך טוב.', {type:'photo',src:'',hint:'כאן תיכנס תמונה שגורמת לה לחייך'}],
      ['יום שישי',16,'שבת של אהבה','עוד רגע שבת, עוד רגע אנחנו. תודה שאת הופכת כל מקום לבית ואת כל חלום למשהו שאפשר להאמין בו.','משימה קטנה: כתבי לעצמך פתק קטן עם דבר שאת אוהבת בך.', {type:'song',url:'',hint:'כאן תוכל לשים שיר רגוע לשישי'}],
      ['שבת',17,'רק אנחנו','בתוך כל ההתרגשות, זו התזכורת הכי חשובה: אנחנו צוות. צוחקים, מתרגשים, ולפעמים גם מאבדים דברים — אבל תמיד יחד.','משימה קטנה: קחי רגע שקט, עצמי עיניים ודמייני את המפגש שלנו מתחת לחופה.', {type:'photo',src:'',hint:'כאן תיכנס תמונה שקטה ואהובה שלכם'}],
      ['יום ראשון',18,'הלילה שלפני','מחר זה קורה, אהובה שלי. הלב שלי מלא בהכרת תודה עלייך, עלינו, ועל כל מי שמגיע לשמוח איתנו. תנסי לנוח — מחר נהפוך למשפחה.','משימה קטנה: לכי לישון מוקדם ככל שאפשר. מחר מחכה לך יום בלתי נשכח.', {type:'video',src:'',hint:'כאן אפשר להוסיף סרטון אישי ממך אליה'}],
      ['יום שני',19,'היום שלנו!','רבקה שלי, זה היום שלנו. בעוד כמה שעות אראה אותך, ואבחר בך מול כל העולם — בדיוק כפי שאני בוחר בך בכל יום מחדש.\n\nאני אוהב אותך. בואי נתחתן!','משימה קטנה: חייכי לעצמך במראה. הכלה הכי יפה בעולם מחכה לך שם.', {type:'song',url:'',hint:'כאן שים את שיר החופה, או שיר שמלווה את הבוקר הגדול'}]
    ];
    const daysEl=document.getElementById('days'),statusEl=document.getElementById('status'),dialog=document.getElementById('letterDialog');
    let preview=false;
    const israelTime=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Jerusalem'}));
    function unlockTime(day){ return new Date(2026,9,day,10,0,0); }
    function available(day){ return preview || israelTime() >= unlockTime(day); }
    function showLetter(i){const d=DAYS[i],media=d[5],memory=document.getElementById('memory'); document.getElementById('letterDate').textContent=`${d[0]} · ${d[1]} באוקטובר`;document.getElementById('letterTitle').textContent=d[2];document.getElementById('letterText').textContent=d[3];document.getElementById('mission').innerHTML=`<strong>✦ ${d[4].split(':')[0]}:</strong>${d[4].split(':').slice(1).join(':')}`; if(media.type==='photo'&&media.src)memory.innerHTML=`<img src="${media.src}" alt="זיכרון שלכם">`;else if(media.type==='video'&&media.src)memory.innerHTML=`<video controls playsinline src="${media.src}"></video>`;else if(media.type==='song'&&media.url)memory.innerHTML=`<a class="song-link" href="${media.url}" target="_blank" rel="noopener"><span>♫</span> פתחי את השיר שבחרתי לך</a>`;else memory.innerHTML=`<div class="media-placeholder">✦ ${media.hint}<br><small>המקום הזה מוכן לתמונה, סרטון או שיר אישי.</small></div>`;dialog.showModal()}
    function render(){ const now=israelTime();daysEl.innerHTML=''; let next=null; DAYS.forEach((d,i)=>{const open=available(d[1]); if(!open&&!next)next=unlockTime(d[1]);const card=document.createElement('button');card.className='day'+(d[1]===19?' wedding':'');card.disabled=!open;card.setAttribute('aria-label',open?`פתיחת ${d[0]}, ${d[1]} באוקטובר`:`נעול עד ${d[1]} באוקטובר ב-10:00`);card.innerHTML=`<span class="card-date"><span class="weekday">${d[0]}</span><span class="day-number">${d[1]}</span><span class="month">באוקטובר</span></span><span class="occasion">${d[1]===19?'✦ יום החתונה ✦':'נעול עד 10:00'}</span>${open?'':`<span class="lock-wrap"><img class="lock-art" src="ornate-lock.png" alt="מנעול זהב עם שרשרת"></span>`}`;if(open)card.addEventListener('click',()=>showLetter(i));daysEl.appendChild(card); });
      if(preview)statusEl.textContent='מצב תצוגה מקדימה פעיל — כל הימים פתוחים רק אצלך.';else if(next){const diff=next-now;const hours=Math.max(0,Math.floor(diff/36e5)),mins=Math.max(0,Math.floor((diff%36e5)/6e4));statusEl.textContent=`ההפתעה הבאה תיפתח בעוד ${hours} שעות ו־${mins} דקות, בשעה 10:00.`}else statusEl.textContent='כל ההפתעות כבר פתוחות. איזה שבוע היה לנו ♥'; }
    document.getElementById('previewButton').addEventListener('click',()=>{preview=!preview;document.getElementById('previewButton').textContent=preview?'חזרה למצב האמיתי':'תצוגה מקדימה לבעל האתר';render()});document.getElementById('closeDialog').addEventListener('click',()=>dialog.close()); dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render();setInterval(render,60000);
  </script>
</body></html>
