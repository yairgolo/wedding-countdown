  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    :root { --wine:#754052; --rose:#df97a9; --blush:#fff1f2; --gold:#bc9149; --ink:#392832; --paper:rgba(255,253,251,.83); }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); font-family:Heebo,Arial,sans-serif; background:#fff9f3 url('floral-background.png') center/cover fixed; }

    .days { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:36px; } .day { position:relative; min-height:232px; border:1px solid rgba(255,255,255,.9); border-radius:25px; padding:18px 12px; cursor:pointer; color:var(--ink); background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,246,246,.73)); box-shadow:0 16px 35px rgba(104,61,69,.1), inset 0 1px 0 white; overflow:hidden; transition:transform .32s ease, box-shadow .32s ease, background .32s; }
    .day::after{content:'';position:absolute;inset:7px;border:1px solid rgba(190,145,73,.16);border-radius:19px;pointer-events:none}.day:not(:disabled):hover { transform:translateY(-7px); background:#fff; box-shadow:0 22px 40px rgba(104,61,69,.18); }.day:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.day:disabled{cursor:not-allowed}

<body>
  <div class="veil"><main>
    <p class="eyebrow">לרבקה שלי, באהבה</p>
    <h1>עוד רגע,<br>לתמיד.</h1>
    <p class="intro">שבוע של הפתעות קטנות,<br>בדרך לרגע הכי גדול שלנו.</p>
    <div class="date-pill">יום שני · 19 באוקטובר 2026</div>
    <div class="countdown" aria-label="הזמן עד בוקר החתונה"><div class="time-unit"><b id="timerMinutes">00</b><span>דקות</span></div><span class="time-dot">:</span><div class="time-unit"><b id="timerHours">00</b><span>שעות</span></div><span class="time-dot">:</span><div class="time-unit"><b id="timerDays">00</b><span>ימים</span></div></div>
    <div class="board-heading"><h2>כל יום, קצת יותר קרובים</h2><span>12–19 באוקטובר</span></div>
    <section class="days" id="days" aria-label="ימי הספירה לאחור"></section>
    <p class="open-note" id="status" aria-live="polite"></p>
    <div class="footer-heart" aria-hidden="true">♡</div><div class="footer-copy">שמונה בקרים. אהבה אחת.</div>
    <button class="preview" id="previewButton" type="button" hidden>תצוגה מקדימה</button>
  </main></div>
  <dialog id="letterDialog"><article class="letter"><button class="close" id="closeDialog" aria-label="סגירה">×</button><div class="letter-date" id="letterDate"></div><h2 id="letterTitle"></h2><div class="memory" id="memory"></div><p id="letterText"></p><div class="mission" id="mission"></div><div class="signature">שלך, תמיד ♥</div></article></dialog>
  <script>
    // החליפו כאן בקלות את הטקסט והמשימה של כל יום. אפשר להוסיף גם תמונות בעתיד.
    const DAYS = [
      ['יום שני',12,'פתיחה ראשונה','אהובה שלי, מתחילים את השבוע שלנו. היום אני רוצה שתזכרי כמה הדרך אלייך הייתה הדבר הכי יפה שקרה לי.\n\nקחי נשימה עמוקה — אנחנו ממש כאן.', 'משימה קטנה: כתבי לי הודעה עם שלושה דברים שאת הכי מתרגשת מהם השבוע.', {type:'photo',src:'',hint:'כאן תכניס תמונה מרגע שמזכיר לך את תחילת הסיפור שלכם'}],
      ['יום שלישי',13,'הסיפור שלנו','רבקה, יש לנו כבר כל כך הרבה רגעים קטנים שהם רק שלנו. היום תני לעצמך לחייך אל אחד מהם — ואני מבטיח לשמור על כל השאר.','משימה קטנה: בחרי תמונה אחת שלנו שאת אוהבת במיוחד ושלחי לי אותה.', {type:'song',url:'',hint:'כאן אפשר לשים קישור לשיר שהוא רק שלכם'}],
      ['יום רביעי',14,'באמצע הדרך','הימים רצים, אבל אני רוצה שנזכור גם לעצור. אני לא מתרגש רק מהחתונה — אני מתרגש מהחיים שמחכים לנו אחריה.','משימה קטנה: פנקי את עצמך היום במשהו קטן ומתוק. זה צו.', {type:'video',src:'',hint:'כאן תוכל להוסיף סרטון קצר, ברכה מצולמת או רגע מצחיק'}],
      ['יום חמישי',15,'חיוך אחד גדול','אם היום לחוץ או עמוס, תזכרי שיש בצד השני של כל הסידורים מישהו שמחכה להיות בעלך. כן, אני עדיין מתרגש מלכתוב את זה.','משימה קטנה: מצאי חמש דקות לשיר בקול שיר שעושה לך טוב.', {type:'photo',src:'',hint:'כאן תיכנס תמונה שגורמת לה לחייך'}],
      ['יום שישי',16,'שבת של אהבה','עוד רגע שבת, עוד רגע אנחנו. תודה שאת הופכת כל מקום לבית ואת כל חלום למשהו שאפשר להאמין בו.','משימה קטנה: כתבי לעצמך פתק קטן עם דבר שאת אוהבת בך.', {type:'song',url:'',hint:'כאן תוכל לשים שיר רגוע לשישי'}],
      ['שבת',17,'רק אנחנו','בתוך כל ההתרגשות, זו התזכורת הכי חשובה: אנחנו צוות. צוחקים, מתרגשים, ולפעמים גם מאבדים דברים — אבל תמיד יחד.','משימה קטנה: קחי רגע שקט, עצמי עיניים ודמייני את המפגש שלנו מתחת לחופה.', {type:'photo',src:'',hint:'כאן תיכנס תמונה שקטה ואהובה שלכם'}],
      ['יום ראשון',18,'הלילה שלפני','מחר זה קורה, אהובה שלי. הלב שלי מלא בהכרת תודה עלייך, עלינו, ועל כל מי שמגיע לשמוח איתנו. תנסי לנוח — מחר נהפוך למשפחה.','משימה קטנה: לכי לישון מוקדם ככל שאפשר. מחר מחכה לך יום בלתי נשכח.', {type:'video',src:'',hint:'כאן אפשר להוסיף סרטון אישי ממך אליה'}],
      ['יום שני',19,'היום שלנו!','רבקה שלי, זה היום שלנו. בעוד כמה שעות אראה אותך, ואבחר בך מול כל העולם — בדיוק כפי שאני בוחר בך בכל יום מחדש.\n\nאני אוהב אותך. בואי נתחתן!','משימה קטנה: חייכי לעצמך במראה. הכלה הכי יפה בעולם מחכה לך שם.', {type:'song',url:'',hint:'כאן שים את שיר החופה, או שיר שמלווה את הבוקר הגדול'}]
    ];
    const daysEl=document.getElementById('days'),statusEl=document.getElementById('status'),dialog=document.getElementById('letterDialog');
    let preview=false;
    const previewEnabled=new URLSearchParams(location.search).get('preview')==='1';
    document.getElementById('previewButton').hidden=!previewEnabled;
    const israelTime=()=>new Date();
    function unlockTime(day){ return new Date(`2026-10-${day}T10:00:00+03:00`); }
    function available(day){ return preview || israelTime() >= unlockTime(day); }
    function showLetter(i){const d=DAYS[i],media=d[5],memory=document.getElementById('memory'); document.getElementById('letterDate').textContent=`${d[0]} · ${d[1]} באוקטובר`;document.getElementById('letterTitle').textContent=d[2];document.getElementById('letterText').textContent=d[3];document.getElementById('mission').innerHTML=`<strong>✦ ${d[4].split(':')[0]}:</strong>${d[4].split(':').slice(1).join(':')}`; if(media.type==='photo'&&media.src)memory.innerHTML=`<img src="${media.src}" alt="זיכרון שלכם">`;else if(media.type==='video'&&media.src)memory.innerHTML=`<video controls playsinline src="${media.src}"></video>`;else if(media.type==='song'&&media.url)memory.innerHTML=`<a class="song-link" href="${media.url}" target="_blank" rel="noopener"><span>♫</span> פתחי את השיר שבחרתי לך</a>`;else memory.innerHTML=`<div class="media-placeholder">✦ ${media.hint}<br><small>המקום הזה מוכן לתמונה, סרטון או שיר אישי.</small></div>`;dialog.showModal()}
    function render(){ const now=israelTime();daysEl.innerHTML=''; let next=null; DAYS.forEach((d,i)=>{const open=available(d[1]); if(!open&&!next)next=unlockTime(d[1]);const card=document.createElement('button');card.className='day'+(open?' available':'')+(d[1]===19?' wedding':'');card.disabled=!open;card.setAttribute('aria-label',open?`פתיחת ${d[0]}, ${d[1]} באוקטובר`:`נעול עד ${d[1]} באוקטובר ב-10:00`);card.innerHTML=`<span class="card-date"><span class="weekday">${d[0]}</span><span class="day-number">${d[1]}</span></span><span class="lock-wrap"><img class="lock-art" src="ornate-lock.png" alt="" loading="lazy"></span><span class="day-caption">${d[1]===19?'היום שלנו':`עוד ${19-d[1]} ${19-d[1]===1?'יום':'ימים'}`}</span><span class="occasion">${open?'ההפתעה שלך מחכה ♡':d[1]===19?'✦ בוקר החתונה · 10:00':'נפתח ב־10:00'}</span>`;if(open)card.addEventListener('click',()=>{card.classList.add('opening');setTimeout(()=>{showLetter(i);card.classList.remove('opening')},matchMedia('(prefers-reduced-motion: reduce)').matches?0:650)});daysEl.appendChild(card); });
      if(preview)statusEl.textContent='תצוגה מקדימה — כל ההפתעות פתוחות לבדיקה.';else if(next){const diff=next-now;const days=Math.floor(diff/864e5),hours=Math.floor(diff%864e5/36e5),mins=Math.floor(diff%36e5/6e4);statusEl.textContent=`ההפתעה הבאה בעוד ${days?days+' ימים, ':''}${hours} שעות ו־${mins} דקות. בכל בוקר ב־10:00, לפי שעון ישראל.`}else statusEl.textContent='כל ההפתעות פתוחות. מכאן — לתמיד ♡'; }
    function updateTimer(){const left=Math.max(0,unlockTime(19)-new Date());document.getElementById('timerDays').textContent=String(Math.floor(left/864e5)).padStart(2,'0');document.getElementById('timerHours').textContent=String(Math.floor(left%864e5/36e5)).padStart(2,'0');document.getElementById('timerMinutes').textContent=String(Math.floor(left%36e5/6e4)).padStart(2,'0')}
    dialog.addEventListener('close',()=>{dialog.querySelectorAll('video').forEach(video=>video.pause())});updateTimer();setInterval(updateTimer,1000);
    document.getElementById('previewButton').addEventListener('click',()=>{preview=!preview;document.getElementById('previewButton').textContent=preview?'חזרה למצב האמיתי':'תצוגה מקדימה לבעל האתר';render()});document.getElementById('closeDialog').addEventListener('click',()=>dialog.close()); dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render();setInterval(render,60000);
  </script>
</body></html>
